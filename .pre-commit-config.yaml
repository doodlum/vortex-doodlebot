# pre-commit.ci writes these messages as both the commit subject and the PR
# title. Keep them Conventional Commits, like every other commit here.
ci:
  autoupdate_commit_msg: "ci: pre-commit autoupdate"
  autofix_commit_msg: "style: auto fixes from pre-commit.com hooks"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        name: Check trusted MkDocs extension tags
        files: ^mkdocs\.yml$
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
