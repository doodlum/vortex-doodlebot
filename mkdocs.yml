site_name: Doodlebot
site_description: An agent companion for Vortex, used from Claude Code or Codex.
site_url: https://doodlum.github.io/vortex-doodlebot/
repo_url: https://github.com/doodlum/vortex-doodlebot
repo_name: doodlum/vortex-doodlebot
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Doodlebot contributors. GPL-3.0-only.
theme:
  name: material
  font: false
  palette:
    scheme: nexus-slate
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - theme/Stylesheets/extra.css
  - stylesheets/doodlebot.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Get started:
      - Requirements: get-started/requirements.md
      - Install the plugin: get-started/install.md
      - Set up doodlebot: get-started/set-up.md
      - Your first session: get-started/first-session.md
  - Guides:
      - Use cases: guides/use-cases.md
      - Try things in Vortex: guides/try-vortex.md
      - Prototype an idea: guides/prototype.md
      - Fix a Vortex bug: guides/fix-a-bug.md
      - Design a feature with EGM: guides/design-a-feature.md
      - Add a regression test: guides/regression-tests.md
      - Open a pull request: guides/pull-requests.md
      - Measure and compare performance: guides/benchmark.md
      - Sign in to Nexus Mods: guides/sign-in.md
      - Use real games and baselines: guides/games-and-baselines.md
      - Work on Vortex source: guides/source-development.md
  - Concepts:
      - How doodlebot works: concepts/how-it-works.md
      - One test Vortex at a time: concepts/one-test-vortex.md
      - Design with EGM: concepts/design-first.md
      - What doodlebot learns: concepts/knowledge.md
      - Evidence and the QA catalogue: concepts/evidence.md
  - Reference:
      - Commands: reference/commands.md
      - doodlebot CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - MCP tools: reference/mcp-tools.md
      - QA catalogue: reference/qa-catalog.md
      - Run report: reference/run-report.md
      - Benchmark report: reference/benchmark-report.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Security and privacy: security.md
      - Contribute: contributing.md
      - Credits: credits.md
