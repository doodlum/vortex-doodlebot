site_name: Doodlebot
site_description: TypeScript tests and performance benchmarks for Vortex.
site_url: https://doodlum.github.io/vortex-doodlebot/
repo_url: https://github.com/doodlum/vortex-doodlebot
repo_name: doodlum/vortex-doodlebot
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Doodlebot contributors. GPL-3.0-only.
theme:
  name: material
  font: false
  palette:
    scheme: nexus-slate
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - theme/Stylesheets/extra.css
  - stylesheets/doodlebot.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
nav:
  - Get started:
      - What Doodlebot does: index.md
      - Install and run your first test: getting-started/first-session.md
  - Guides:
      - Run a collection: getting-started/setup.md
      - Run benchmarks: testing/benchmarks.md
      - Write a benchmark: testing/adding-benchmarks.md
      - Prepare table fixtures: testing/table-fixtures.md
      - Read and compare results: testing/results.md
      - Drive the UI: guides/ui-automation.md
      - Install and deploy a mod: guides/mod-workflows.md
      - Save a screenshot: guides/capture.md
      - Call app tools: guides/calling-tools.md
  - Test plan:
      - Collection and table coverage: testing/proposal.md
  - Reference:
      - Overview: reference/index.md
      - Sessions: reference/sessions.md
      - Benchmark runner: reference/runner.md
      - Tables: reference/tables.md
      - Collection setup and controls: reference/collections.md
      - Options and results: reference/results.md
      - CLI commands: reference/cli.md
      - App tools: reference/mcp-tools.md
      - Configuration: reference/configuration.md
      - Package scripts: reference/package-scripts.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Security and privacy: security.md
      - Credits: credits.md
  - Development:
      - Contribute to Doodlebot: contributing.md
      - Run repository checks: testing/running.md
      - Extend the Playwright suite: testing/integration.md
      - Write unit tests: testing/unit.md
